server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SSE 即時推播：關閉 nginx 緩衝，否則訊息會被 nginx 囤著不即時吐出
  location /api/stream {
    proxy_pass http://backend:8000/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # 即時偵測骨架 SSE（live-detection/stream）
  location /api/events/live-detection/stream {
    proxy_pass http://backend:8000/events/live-detection/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header X-Accel-Buffering no;
  }

  # 靜態影像/影片檔案：讓前端透過同源相對路徑抓取，避開 Safari 嚴格的跨網域與跨 Port 限制
  location /images/ {
    proxy_pass http://backend:8000/images/;
  }

  # 其他 API：把 /api 帽子拿掉，轉給後端（/api/events → 後端 /events）
  location /api/ {
    proxy_pass http://backend:8000/;
  }

  # 其餘一律回 React 首頁，交給前端路由自己處理
  location / {
    try_files $uri $uri/ /index.html;
  }
}
