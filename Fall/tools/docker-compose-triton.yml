version: '3.8'

services:
  triton-server:
    image: nvcr.io/nvidia/tritonserver:23.10-py3
    container_name: nh-triton-server
    shm_size: '2gb' # 預留共享記憶體，防止大型影像模型推論時崩潰
    ports:
      - "8000:8000" # HTTP 端口
      - "8001:8001" # gRPC 端口 (inference_test.py 主要連線這個)
      - "8002:8002" # Metrics 監控端口
    volumes:
      # 自動將上一層的 model_repository 掛載到容器中
      - ../model_repository:/models
    # 💡 修正：在 command 陣列最後面加上 "--model-control-mode=poll" 啟動自動輪詢
    command: ["tritonserver", "--model-repository=/models", "--allow-grpc=true", "--allow-http=true", "--model-control-mode=poll"]
    restart: "no"