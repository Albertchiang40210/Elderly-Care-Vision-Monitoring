version: '3.8'

services:
  # --- 1. 後端 API 服務 (FastAPI) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nh-backend
    restart: "no"
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST:-nh-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-aidb}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-northeast-1}
    volumes:
      - ./Fall/active_learning_dataset:/app/Fall/active_learning_dataset
      - ${AWS_CREDENTIALS_PATH:-~/.aws}:/root/.aws:ro

  # --- 2. 前端服務 (React + Nginx 整合中控台) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nh-frontend
    restart: "no"
    depends_on:
      - backend
    ports:
      - "3000:80"  # 外部造訪通道路徑: http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: tools_default
    external: true