version: '3.8'

services:
  # --- 1. 後端 API 服務 (FastAPI) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nh-backend
    restart: "no"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=nh-postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-testuser}
      - DB_PASSWORD=${DB_PASSWORD:-testpassword}
      - DB_NAME=${DB_NAME:-aidb}

      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-northeast-1}
      - EVENT_API_KEY=${EVENT_API_KEY:-nAK4h8ARAJMjCSoWJ-uErx2KyZKGDF-jcXqmMUpkM_o}
    volumes:
      - ./Fall/active_learning_dataset:/app/Fall/active_learning_dataset
      - ./backend/static:/app/static
      - ${AWS_CREDENTIALS_PATH:-~/.aws}:/root/.aws:ro

  # --- 2. 前端服務 (React + Nginx 整合中控台) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nh-frontend
    restart: "no"
    depends_on:
      - backend
    ports:
      - "3000:80"  # 外部造訪通道路徑: http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- 3. Netdata 即時系統效能監控儀表板 (不隨 Docker 自動重啟) ---
  netdata:
    image: netdata/netdata:latest
    container_name: nh-netdata
    hostname: aipe03-edge-monitor
    restart: "no"
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  default:
    name: tools_default
    external: true