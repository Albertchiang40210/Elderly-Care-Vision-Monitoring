name: 🏥 AIPE03 智慧病房 MLOps 自動化防線

# 設定什麼時候要啟動這條流水線
on:
  push:
    branches: [ "main", "master", "albert_chiang" ]
  pull_request:
    branches: [ "main", "master", "albert_chiang" ]

jobs:
  health-check:
    runs-on: ubuntu-latest # 讓 GitHub 免費提供一台虛擬 Linux 伺服器來跑檢查

    steps:
    - name: 📥 1. 複製專案程式碼
      uses: actions/checkout@v4

    - name: 🐍 2. 安裝 Python 環境 (3.11)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 3. 安裝系統與 OpenCV 依賴 (Linux 跑 OpenCV 必備)
      run: |
        sudo apt-get update
        # 替換為最新 Ubuntu 相容的 OpenGL 依賴庫
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: ⚙️ 4. 安裝專案 Requirements 套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔍 5. 語法防呆檢查 (針對 Fall/tools 資料夾)
      run: |
        pip install flake8
        # 💡 終極對齊：忽略無傷大雅的 F824 警告，只嚴格抓取最致命的語法錯誤
        flake8 Fall/tools/ --count --select=E9,F63,F7,F82 --ignore=F824 --show-source --statistics

    - name: 📝 6. 驗證大腦重訓設定檔 (data.yaml) 是否毀損
      run: |
        # 指向你 Fall/tools/data.yaml 的正確位置，確保沒有格式打錯
        python -c "import yaml; yaml.safe_load(open('Fall/tools/data.yaml'))"